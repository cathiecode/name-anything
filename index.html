<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="万物名付け機">
    <meta property="og:description" content="ありのままの混沌を受け入れる">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://cathiecode.github.io/name-anything">
    <meta property="og:site_name" content="万物名付け機">
    <meta property="og:locale" content="ja_JP">
    <title>万物名付け機</title>
    <style>
        /* Bootstrap-inspired minimal styles */
        .btn {
            display: inline-block;
            font-weight: 400;
            text-align: center;
            white-space: nowrap;
            vertical-align: middle;
            border: 1px solid transparent;
            padding: 0.375rem 0.75rem;
            font-size: 1rem;
            line-height: 1.5;
            border-radius: 0.375rem;
            transition: all 0.15s ease-in-out;
            cursor: pointer;
        }
        
        .btn-primary {
            color: #fff;
            background-color: #007bff;
            border-color: #007bff;
        }
        
        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #004085;
        }
        
        .btn-lg {
            padding: 0.5rem 1rem;
            font-size: 1.25rem;
            border-radius: 0.5rem;
        }
        
        .container-fluid {
            width: 100%;
            padding-right: 15px;
            padding-left: 15px;
            margin-right: auto;
            margin-left: auto;
        }
        
        .vh-100 {
            height: 100vh;
        }
        
        .d-flex {
            display: flex;
        }
        
        .flex-column {
            flex-direction: column;
        }
        
        .flex-grow-1 {
            flex-grow: 1;
        }
        
        .align-items-center {
            align-items: center;
        }
        
        .justify-content-center {
            justify-content: center;
        }
        
        .text-center {
            text-align: center;
        }
        
        .text-end {
            text-align: right;
        }
        
        .mt-5 {
            margin-top: 3rem;
        }
        
        .mb-4 {
            margin-bottom: 1.5rem;
        }
        
        .p-3 {
            padding: 1rem;
        }
        
        .alert {
            position: relative;
            padding: 0.75rem 1.25rem;
            margin-bottom: 1rem;
            border: 1px solid transparent;
            border-radius: 0.375rem;
        }
        
        .alert-success {
            color: #155724;
            background-color: #d4edda;
            border-color: #c3e6cb;
        }
        
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        
        #naming {
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.5s ease-in;
        }

        #naming.named {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container-fluid vh-100 d-flex flex-column">
        <div class="text-center mt-5">
            ↑
            <br />
            名付けたいものに向ける
        </div>
        <div class="flex-grow-1 d-flex align-items-center justify-content-center">
            <div class="text-center">
                <div id="naming" class="mb-4">
                    <h4>命名:</h4>
                    <div class="alert alert-success" role="alert">
                        <span id="name">f3752a4a-fae4-471a-b483-eab7908af22b</span>
                    </div>
                </div>
                <button id="create_name" class="btn btn-primary btn-lg">名付ける</button>
            </div>
        </div>
        <div class="text-end p-3">
            Contribute on <a href="https://github.com/cathiecode/name-anything">Github</a>
        </div>
    </div>

    <script type="module">
        // Simple UUID v4 generator as fallback
        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        {
            const button = document.getElementById("create_name");
            const namingResultContainer = document.getElementById("naming");
            const nameResultContainer = document.getElementById("name");

            button.addEventListener("click", () => {
                namingResultContainer.classList.add("named");
                nameResultContainer.textContent = generateUUID();
            });
        }
    </script>
</body>
</html>
